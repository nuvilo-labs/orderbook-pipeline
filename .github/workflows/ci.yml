name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ingestion tests
        working-directory: services/ingestion
        run: uv run pytest